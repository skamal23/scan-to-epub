appId: host.exp.Exponent
name: Phase 8 guarded PDF conversion flows
---
- launchApp
- tapOn: Book to EPUB
- assertVisible: Book to EPUB
- assertVisible: Backend connected
- tapOn: Test scenarios
- scrollUntilVisible:
    element:
      text: PDF test EPUB
    direction: DOWN
- tapOn: PDF test EPUB
- assertVisible: Generated open edition
- assertVisible: "Authorized PDF Source \\(test export\\)"
- assertVisible: Deterministic PDF fixture
- assertVisible: ".*converted into this EPUB without AI-generated text.*"
- scrollUntilVisible:
    element:
      text: Why this edition is available
    direction: DOWN
- tapOn: Why this edition is available
- scrollUntilVisible:
    element:
      text: "guarded-pdf/1 .* structured-epub/1"
    direction: DOWN
- assertVisible: "guarded-pdf/1 .* structured-epub/1"
- assertVisible: ".*accounted for 3 PDF body blocks.*"
- assertVisible: "Source SHA-256 .*"
- assertVisible: "EPUB SHA-256 .*"
- takeScreenshot: .maestro/artifacts/phase8-pdf-generated-details
- scrollUntilVisible:
    element:
      text: Open in Books
    direction: UP
- tapOn: Open in Books
- assertVisible: Save to Files
- takeScreenshot: .maestro/artifacts/phase8-pdf-share-sheet
- tapOn:
    point: 50%, 20%
- assertVisible: EPUB is ready to share again.
- scrollUntilVisible:
    element:
      text: Scan another book
    direction: DOWN
- tapOn: Scan another book
- assertVisible: Scan a cover or ISBN
- tapOn: Back
- tapOn: Test scenarios
- scrollUntilVisible:
    element:
      text: PDF conversion refused
    direction: DOWN
- tapOn: PDF conversion refused
- assertVisible: Book identified, open edition unavailable
- assertVisible: "We found an authorized PDF, but could not safely convert its layout into an EPUB."
- assertNotVisible: Open in Books
- assertNotVisible: Save to Files
- takeScreenshot: .maestro/artifacts/phase8-pdf-refusal
