appId: host.exp.Exponent
name: Phase 8 guarded PDF conversion flows
---
- launchApp
- tapOn: Book to EPUB
- assertVisible: Search manually
- tapOn: Back
- assertVisible: Book to EPUB
- tapOn: Test scenarios
- scrollUntilVisible:
    element:
      text: PDF test EPUB
    direction: DOWN
- tapOn: PDF test EPUB
- assertVisible: Generated open edition
- assertVisible: "Authorized PDF Source \\(test export\\)"
- assertVisible: Deterministic PDF fixture
- assertVisible: ".*converted into this EPUB without AI-generated text.*"
- assertVisible: Open in Books
- scrollUntilVisible:
    element:
      text: Why this edition is available
    direction: DOWN
- tapOn: Why this edition is available
- scrollUntilVisible:
    element:
      text: "guarded-pdf/3 .* structured-epub/1"
    direction: DOWN
- assertVisible: "guarded-pdf/3 .* structured-epub/1"
- assertVisible: ".*accounted for 3 PDF body blocks.*"
- assertVisible: "Source SHA-256 .*"
- assertVisible: "EPUB SHA-256 .*"
- takeScreenshot: .maestro/artifacts/phase8-pdf-generated-details
# The iOS share sheet is system-owned and terminal for this flow. Tapping it
# leaves Maestro's driver waiting on iOS, so presentation is checked separately
# through Computer Use in Simulator.
