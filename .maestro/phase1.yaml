- tapOn: Book to EPUB
- assertVisible: Search manually
- tapOn: Search manually
- assertVisible: Find your book
- tapOn:
    id: isbn-input
- inputText: 9780141439518
- tapOn: Find your book
- tapOn: Find book
- assertVisible: Is this your book?
- assertVisible: Choose Pride and Prejudice by Jane Austen
- tapOn: Choose Pride and Prejudice by Jane Austen
- assertVisible: Ready to read
- assertVisible: Open in Books
- assertVisible: Save to Files
- assertVisible: Details
- assertNotVisible: Your physical edition
- assertNotVisible: The open digital edition may differ.*
- takeScreenshot: .maestro/artifacts/phase1-confirmed
- scrollUntilVisible:
    element:
      text: Scan another book
    direction: DOWN
- tapOn: Scan another book
- tapOn: Back
- tapOn: Test scenarios
- scrollUntilVisible:
    element:
      text: Ambiguous books
    direction: DOWN
- tapOn: Ambiguous books
- assertVisible: Is this your book?
- assertVisible: Choose Invisible Man by Ralph Ellison
- assertVisible: Choose The Invisible Man by H. G. Wells
- tapOn: None of these
- assertVisible: Find your book
- tapOn: Back
- tapOn: Back
- tapOn: Test scenarios
- scrollUntilVisible:
