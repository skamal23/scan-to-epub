      text: Catalog warning
    direction: DOWN
- tapOn: Catalog warning
- assertVisible: Is this your book?
- assertVisible: Some catalogs were unavailable.*
- tapOn: Edit search
- tapOn: Back
- tapOn: Back
- tapOn: Test scenarios
