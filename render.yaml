services:
  - type: web
    name: book-reader-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    disk:
      name: verified-deliveries
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOOK_ENVIRONMENT
        value: production
      - key: BOOK_FIXTURE_MODE
        value: "false"
      - key: BOOK_ARTIFACT_DATABASE
        value: /data/deliveries.sqlite
      - key: BOOK_CONTACT_EMAIL
        sync: false
      - key: BOOK_CORS_ORIGINS
        sync: false
